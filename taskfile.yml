version: '3'

vars:
  DATA: .data/soft-serve
  VIEW: .data/view
  GO_PKGS: ./...

tasks:
  build:
    desc: Build the UI, then bin/codeview with ui/dist embedded
    cmds:
      - task: ui:build
      - go build -o bin/codeview ./cmd/codeview

  test:
    desc: Run the Go tests
    cmds:
      - go test -race {{.GO_PKGS}}

  check:
    desc: Vet and test the Go code
    cmds:
      - go vet {{.GO_PKGS}}
      - task: test

  ui:install:
    dir: ui
    cmds:
      - npm install
    status:
      - test -d node_modules

  ui:build:
    desc: Build the UI into ui/dist
    dir: ui
    deps: [ui:install]
    cmds:
      - npm run build

  seed:
    desc: Mirror a few public repositories into .data/soft-serve/repos/seed
    vars:
      REPOS: charmbracelet/soft-serve go-chi/chi toaweme/cli
    cmds:
      - mkdir -p {{.DATA}}/repos/seed
      - for: { var: REPOS, split: ' ' }
        cmd: |
          dest={{.DATA}}/repos/seed/$(basename {{.ITEM}}).git
          if [ -d "$dest" ]; then git --git-dir="$dest" fetch -q --prune origin; else git clone -q --mirror https://github.com/{{.ITEM}}.git "$dest"; fi

  dev:mirror:
    desc: Mirror the repositories dev/gickup.yml names into .data/gickup
    cmds:
      - mkdir -p .data/gickup
      - docker compose run --rm gickup

  dev:links:
    desc: Combine soft-serve, gickup and a few GOPATH repositories into .data/view through symlinks
    vars:
      GOPATH_REPOS: cli log http
      GOPATH:
        sh: go env GOPATH
    cmds:
      - mkdir -p {{.VIEW}}/gopath {{.DATA}}/repos .data/gickup
      - ln -sfn ../soft-serve/repos {{.VIEW}}/soft-serve
      - ln -sfn ../gickup {{.VIEW}}/gickup
      - for: { var: GOPATH_REPOS, split: ' ' }
        cmd: ln -sfn {{.GOPATH}}/src/github.com/toaweme/{{.ITEM}} {{.VIEW}}/gopath/{{.ITEM}}
