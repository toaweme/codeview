<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>codeview</title>
    <meta name="description" content="A fast, read-only web UI for your git repositories." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#dde2e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060709" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const s = localStorage.getItem('gv:theme') || 'system'
          const m = window.matchMedia('(prefers-color-scheme: dark)').matches
          const d = s === 'dark' || (s === 'system' && m)
          const e = document.documentElement
          e.classList.toggle('dark', d)
          e.style.colorScheme = d ? 'dark' : 'light'
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
